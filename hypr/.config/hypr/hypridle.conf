# Idle handling: dim after 5 minutes, screen off after 10. Deliberately no
# lock and no suspend — any input wakes the screen straight back into the
# session. Apps playing video inhibit idle through the compositor, so a
# movie doesn't dim. Runs as the hypridle user service (see README).

general {
    # dpms back on when resuming from a systemd suspend (lid close etc.),
    # harmless otherwise
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"
}

# stage 1: dim to 10%, remembering the level (-s saves, -r restores)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# stage 2: screen off entirely
listener {
    timeout = 600
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ mode = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ mode = 'on' })"
}
