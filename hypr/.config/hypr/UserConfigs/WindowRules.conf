
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun
$browser = firefox



# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
#vwindowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


# make window look transparent based on focus state
# The first value  → opacity when the window is active (focused)
# The second value  → opacity when inactive (unfocused)
windowrulev2 = opacity 0.85 0.7,class:^(code)$
windowrulev2 = opacity 0.85 0.7,class:^(firefox)$
windowrulev2 = opacity 0.80 0.7,class:^(spotify)$

