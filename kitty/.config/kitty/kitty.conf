# sets the shell to zsh
shell /bin/zsh

# font settings — same Nerd Font as waybar and VS Code (see fontconfig/)
font_family CodeNewRoman Nerd Font Mono
font_size 9.0

background_opacity 0.45

# Monokai Vibrant colors, deliberately not following the desktop theme:
# it matches the VS Code theme instead (the p10k prompt still carries the
# theme accent via its generated overlay)
background #121212
foreground #F8F8F2
color0  #1c1c1c
color1  #f92672
color2  #a6e22e
color3  #fd971f
color4  #66d9ef
color5  #ae81ff
color6  #38ccd1
color7  #f8f8f2
color8  #75715e
color9  #f92672
color10 #a6e22e
color11 #fd971f
color12 #66d9ef
color13 #ae81ff
color14 #38ccd1
color15 #f9f8f5
