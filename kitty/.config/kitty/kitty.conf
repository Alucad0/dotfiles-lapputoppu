# sets the shell to zsh
shell /bin/zsh

# font settings — same Nerd Font as waybar and VS Code (see fontconfig/)
font_family CodeNewRoman Nerd Font Mono
font_size 9.0

# Colours follow the desktop theme: ~/.local/bin/theme generates theme.conf
# next to this (symlinked) file and SIGUSR1-reloads running kitties on every
# switch. Not in the repo — run `theme apply` once if it's missing.
include theme.conf

# 0.65: enough wallpaper to stay frosted, enough background that the theme's
# undertone (green vs navy) actually reads
background_opacity 0.65
