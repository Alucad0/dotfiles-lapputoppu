# Backend routing for xdg-desktop-portal. Read only when
# XDG_CURRENT_DESKTOP=Hyprland (which the Hyprland session sets).
#
# Three backends are installed: -hyprland (wanted), -gtk (wanted, see below)
# and -kde (pulled in as a Dolphin/plasma-integration dependency, not wanted).
# Without this file the pick is left to portal's own scoring, so a file dialog
# or a screencast prompt can silently change backend after an update.
[preferred]
default=hyprland;gtk

# hyprland has no FileChooser; the GTK one is the themed one — install.sh
# points it at the Catppuccin GTK theme through dconf.
org.freedesktop.impl.portal.FileChooser=gtk

# Dark-mode preference for Electron/Firefox/libadwaita apps. The GTK backend
# reports org.gnome.desktop.interface color-scheme, which install.sh sets to
# prefer-dark; hyprland's backend does not serve that key.
org.freedesktop.impl.portal.Settings=gtk
