# Weekly mirror refresh (reflector.timer reads this from
# /etc/xdg/reflector/reflector.conf — root-owned system config, so like
# sddm/ it's copied, not symlinked; re-copy after editing, see README).
# Conservative: https-only mirrors near Sweden, sorted by download rate.
--save /etc/pacman.d/mirrorlist
--protocol https
--country Sweden,Denmark,Norway,Germany
--latest 20
--sort rate
